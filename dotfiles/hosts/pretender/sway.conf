# Preferred applications.
set $termbin alacritty
set $term alacritty --class=$title
set $browser brave-browser --ozone-platform=wayland
set $launcher wofi --show=drun,run
set $filemanager nautilus
set $brightness_up brightnessctl set +10%
set $brightness_down brightnessctl set 10%-
# dex isn't installed here.
set $autostart_xdg true

# Monitors. Geometry lives in ~/.config/kanshi/config; keep these in sync with
# the positions in the docked profile there.
#
# The Dell is named by make/model/serial because its connector has drifted
# DP-2 -> DP-5 -> DP-6 -> DP-7 across reboots.
#
# Two heads, so $out_left and $out_main are both the Dell: it sits at x=0 and
# it's the one with the keyboard in front of it. Undocked they name a monitor
# that isn't there and $mod+w / $mod+e become no-ops, which sway warns about
# and then carries on. Following kanshi's active profile would want a script
# watching for hotplug, which is more machinery than the annoyance is worth.
set $out_left  "Dell Inc. DELL P2422H D599FQ3"
set $out_main  "Dell Inc. DELL P2422H D599FQ3"
set $out_right "AU Optronics 0xF99A Unknown"
