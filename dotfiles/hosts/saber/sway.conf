# Preferred applications.
set $termbin alacritty
set $term kitty --class=$title
set $browser vivaldi
set $launcher wofi --show=drun,run
set $filemanager nautilus
# `light` reads and writes a raw backlight percentage, so stepping by a fixed
# amount is uneven at the dim end. The 1.4x ramp is roughly perceptual, and
# the +.72 keeps the integer truncation from pinning the value at 0 or 1.
set $brightness_up light -S "$(light -G | awk '{ print int(($1 + .72) * 1.4) }')"
set $brightness_down light -S "$(light -G | awk '{ print int($1 / 1.4) }')"
# dex isn't installed here.
set $autostart_xdg true

set $wallpaper /home/cam/System/wallpaper.png stretch

# Monitors. Geometry lives in ~/.config/kanshi/config; keep these in sync with
# the positions in the docked profile there.
#
# Three heads laid out left to right, so each binding names a different panel.
# Undocked, $mod+w and $mod+e name monitors that aren't there and become
# no-ops, which sway warns about and then carries on.
set $out_left  DP-2
set $out_main  HDMI-A-1
set $out_right eDP-1
