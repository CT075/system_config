# Per-host sway configuration. Copy this to hosts/$SYSNAME/sway.conf and fill
# it in; scripts/link-sway symlinks it to ~/.config/sway/host.conf, where the
# loader reads it after variables.conf and before config.d/.
#
# Every hook below has to be set. There are deliberately no defaults: an unset
# sway variable substitutes as its own literal text, so a missing line here
# turns into a confusing failure at keypress time rather than at parse time.

# Preferred applications.

# Plain terminal, for $mod+Shift+Return.
set $termbin
# Dropdown terminal, for $mod+t. Must carry --class=$title, or
# 50-scratchpad.conf won't recognise the window.
set $term --class=$title
# $mod+Shift+p then $mod+c.
set $browser
# $mod+p.
set $launcher wofi --show=drun,run
# $mod+Shift+p then $mod+f.
set $filemanager nautilus
# Whole commands, not binary names, since light and brightnessctl take
# unrelated arguments.
set $brightness_up
set $brightness_down
# XDG autostart. `dex --autostart --environment i3` where dex is installed,
# `true` where it isn't.
set $autostart_xdg true

# Wallpaper, for `output * bg` in 20-output.conf. This is the whole tail of
# that command, so either `/path/to/image.png stretch` or, with no image,
# `#242424 solid_color`. A path that doesn't resolve is a config error, not a
# warning, and puts swaynag on screen at every reload.
set $wallpaper #242424 solid_color

# Monitors, for the $mod+w/e/r bindings in 64-bindings-output.conf. Keep these
# in sync with the positions in hosts/$SYSNAME/kanshi, which is what actually
# lays the outputs out.
#
# An output can be named by connector (eDP-1) or by make/model/serial, which
# is what to reach for when a connector drifts across reboots. Fewer than
# three heads means repeating a name, and a single-head machine sets all three
# the same so the bindings parse as no-ops.
set $out_left
set $out_main
set $out_right
