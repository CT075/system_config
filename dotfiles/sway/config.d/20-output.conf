# Wallpaper, and the kanshi daemon that owns output geometry.
#
# Positions and modes live in ~/.config/kanshi/config, not here. Setting them
# in both places means sway lays the outputs out at startup and kanshi lays
# them out again a moment later, so only kanshi does it.

# $wallpaper is the whole tail of the bg command, so a host with an image sets
# `<path> stretch` and a host without one sets `<colour> solid_color`. A
# missing file is a config error rather than a warning, which puts swaynag on
# screen at every reload, so there is no useful default to bake in here.
output * bg $wallpaper

exec_always "systemctl --user restart kanshi.service"
