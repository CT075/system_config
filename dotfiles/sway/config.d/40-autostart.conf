# Things that get started with the session.

# XDG autostart. $autostart_xdg is a host hook because dex isn't installed
# everywhere; hosts without it set the hook to `true`.
exec $autostart_xdg

# Idle handling. The lock script is ~/.config/sway/lock and the suspend script
# is ~/.config/sway/idle-suspend, both symlinks into sys_base/scripts.
#
# The before-sleep guard is there so resuming from a suspend that swayidle
# itself triggered doesn't stack a second swaylock on top of the first.
exec swayidle -w timeout 600 '~/.config/sway/lock' timeout 1800 '~/.config/sway/idle-suspend' before-sleep 'pgrep -x swaylock >/dev/null || ~/.config/sway/lock'

exec systemctl --user import-environment DISPLAY WAYLAND_DISPLAY SWAYSOCK
exec hash dbus-update-activation-environment 2>/dev/null && dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY SWAYSOCK

# NetworkManager is the most popular way to manage wireless networks on Linux,
# and nm-applet is a desktop environment-independent system tray GUI for it.
exec nm-applet

exec sway-audio-idle-inhibit

# Notifications.
exec mako

# Screenshot daemon, driven by the $mod+s binding in 61-bindings-launch.conf.
exec flameshot
