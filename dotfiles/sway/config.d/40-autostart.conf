# Things that get started with the session.

# XDG autostart. $autostart_xdg is a host hook because dex isn't installed
# everywhere; hosts without it set the hook to `true`.
exec $autostart_xdg

# Idle handling lives in ~/.config/sway/idle, a symlink into sys_base/scripts.
# The swayidle line isn't spelled out here because ~/.config/sway/present has to
# stop and restart the daemon around a talk with the same argument list, and two
# hand-synced copies of it is how you end up presenting to a lock screen. The
# chain, the timings, and why hibernate isn't part of it are commented at the
# top of that script.
#
# exec_always rather than exec, so a config reload re-runs it. `idle start` is a
# no-op when swayidle is already up, which is what makes that safe.
exec_always ~/.config/sway/idle start

# The environment used to be imported here by hand. It isn't any more.
# /etc/sway/config.d/10-systemd-session.conf, included first by the loader, runs
# sway-systemd's session.sh, which imports a larger variable set into both
# systemd and dbus and then starts sway-session.target.
#
# The hand-rolled version wasn't wrong so much as it was camouflage. It set the
# three variables you'd think to check, so a session where session.sh never ran
# still looked healthy from `systemctl --user show-environment`, and the missing
# sway-session.target only showed up as xdg-desktop-portal failing on
# "Dependency failed for xdg-desktop-portal.service" somewhere in the journal.

# NetworkManager is the most popular way to manage wireless networks on Linux,
# and nm-applet is a desktop environment-independent system tray GUI for it.
exec nm-applet

exec sway-audio-idle-inhibit

# Notifications. mako and swaync both claim org.freedesktop.Notifications on
# the session bus, so which one you get with both installed comes down to
# dbus filename order. ~/.config/sway/notifyd picks one and makes the pick
# stick; see the comment at the top of it.
exec ~/.config/sway/notifyd sync

# Screenshot daemon, driven by the $mod+s binding in 61-bindings-launch.conf.
exec flameshot
