# Ad-hoc monitors and presentation mode.
#
# 64-bindings-output.conf handles moving between screens that the host file
# already knows about. This file handles the screen it doesn't: $mod+d asks
# what to do with whatever just got plugged in, and $mod+Shift+d says "the
# thing I plugged in is an audience".
#
# Both keys run scripts rather than sway commands, because the answer depends
# on the size of a monitor nobody knew about until ninety seconds ago. See the
# comment at the top of ~/.config/sway/display.

bindsym $mod+d exec ~/.config/sway/display menu
bindsym $mod+Shift+d exec ~/.config/sway/present toggle

# $mod+d goes through the script rather than straight to `mode display`, so
# that pressing it with nothing plugged in says so instead of trapping you in a
# mode with no valid choices.
#
# Same shape as `mode startapp` in 61-bindings-launch.conf: each branch drops
# back to the default mode first, because a mode that outlives its own action
# swallows the next keystroke.
mode "display" {
        bindsym m exec "swaymsg mode default; ~/.config/sway/display mirror"
        bindsym e mode "display-extend"
        bindsym x exec "swaymsg mode default; ~/.config/sway/display external"
        bindsym i exec "swaymsg mode default; ~/.config/sway/display internal"

        bindsym Return mode "default"
        bindsym Escape mode "default"
}

# Which side the external goes on. j is up and k is down, matching
# 62-bindings-focus.conf rather than vim; this config has had them that way
# round for years and one file disagreeing is worse than the convention being
# unusual.
mode "display-extend" {
        bindsym j exec "swaymsg mode default; ~/.config/sway/display extend up"
        bindsym k exec "swaymsg mode default; ~/.config/sway/display extend down"
        bindsym h exec "swaymsg mode default; ~/.config/sway/display extend left"
        bindsym l exec "swaymsg mode default; ~/.config/sway/display extend right"

        bindsym Up    exec "swaymsg mode default; ~/.config/sway/display extend up"
        bindsym Down  exec "swaymsg mode default; ~/.config/sway/display extend down"
        bindsym Left  exec "swaymsg mode default; ~/.config/sway/display extend left"
        bindsym Right exec "swaymsg mode default; ~/.config/sway/display extend right"

        bindsym Return mode "default"
        bindsym Escape mode "default"
}
