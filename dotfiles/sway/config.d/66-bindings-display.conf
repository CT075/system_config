# Ad-hoc monitors and presentation mode.
#
# 64-bindings-output.conf handles moving between screens. This file handles
# deciding what the screens are: $mod+d asks what to do with whatever just got
# plugged in, and $mod+Shift+d says "the thing I plugged in is an audience".
#
# Both keys run scripts rather than sway commands, because the answer depends
# on the size of a monitor nobody knew about until ninety seconds ago. See the
# comment at the top of ~/.config/sway/display.

bindsym $mod+d exec ~/.config/sway/display menu $menu
bindsym $mod+Shift+d exec ~/.config/sway/present toggle

# $mod+d used to enter a `display` binding mode with m/e/x/i, and a second mode
# under e for the direction. It pops a dmenu-style picker now. Two reasons.
#
# A mode is a keymap you have to have learned, and this one is reached at most
# a few times a year, always in the ninety seconds before a talk. The picker
# spells the options out, which is the difference between reading and
# remembering.
#
# And a mode that outlives its own action swallows the next keystroke, so every
# branch had to drop back to the default mode first. The picker has no such
# footgun; sway is in the default mode the whole time.
#
# The script still owns the "is there anything to choose about" check, so
# pressing $mod+d with nothing plugged in says so instead of opening an empty
# menu. Choosing a layout there is also what puts $mod+e and $mod+r onto the
# internal and external panels.
#
# $menu is the host file's picker in dmenu mode, the same program $launcher
# names. It comes through as an argument rather than being hardcoded for the
# same reason every other program in this config does: the host file is where
# this repo says which tools exist. Each entry in the menu opens with a
# two-letter handle, so `ej` then Return is extend-up without reading
# anything.
