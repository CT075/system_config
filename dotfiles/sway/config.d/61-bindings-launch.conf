# Launching things. Every program name here is a host hook from host.conf.

# start a terminal
bindsym $mod+Shift+Return exec $termbin

# start a program launcher
bindsym $mod+p exec "$launcher"

# screenshots. flameshot is started in 40-autostart.conf.
bindsym $mod+s exec XDG_CURRENT_DESKTOP=sway flameshot gui --raw | wl-copy
bindsym $mod+Shift+s exec grim -g "$(slurp -d)" - | wl-copy -t image/png

for_window [app_id="flameshot"] border pixel 0, floating enable, fullscreen disable, move absolute position 0 0

mode "startapp" {
        bindsym $mod+c exec "swaymsg mode default; $browser"
        bindsym $mod+f exec "swaymsg mode default; $filemanager"

        bindsym Return mode "default"
        bindsym Escape mode "default"
}

bindsym $mod+Shift+p mode startapp
