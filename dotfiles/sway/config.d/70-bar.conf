# Workspace bar plus whatever system information i3status finds.
#
# The status command is ~/.config/sway/statusbar rather than i3status itself.
# It runs i3status and splices a PRESENTING block onto the front of the status
# line while presentation mode is on; see the comment at the top of it.
#
# That wrapper is also why ~/.config/i3status/config exists. i3status picks its
# output format by looking at the name of its parent process, and putting a
# script in the middle breaks the guess, so the format is pinned there instead.

bar {
        status_command ~/.config/sway/statusbar
}

