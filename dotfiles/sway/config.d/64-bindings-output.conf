# Jumping between monitors.
#
# $out_left, $out_main and $out_right come from host.conf, which is also where
# the geometry that makes "left" and "right" true is asserted. Sway can't be
# asked which panel is physically leftmost, so the host says.
#
# On a two-head machine two of these name the same panel and one of the three
# bindings is a duplicate. That's fine.
#
# The literals reach the script as ordinary arguments, because sway substitutes
# variables at parse time and then hands the whole `exec` line to sh. They are
# the right answer on a machine kanshi has a profile for and useless on a
# projector nobody wrote one for, so the script picks between them and the
# internal/external panels depending on whether a layout was chosen by hand
# from $mod+d. See "Manual layouts" at the top of ~/.config/sway/display.
#
# Going through a script also means an unset $out_* is a silent no-op rather
# than a per-press warning in sway's log, which is what undocked used to give.

bindsym $mod+w exec ~/.config/sway/display focus left $out_left
bindsym $mod+e exec ~/.config/sway/display focus main $out_main
bindsym $mod+r exec ~/.config/sway/display focus right $out_right

bindsym $mod+Shift+w exec ~/.config/sway/display focus left --move $out_left
bindsym $mod+Shift+e exec ~/.config/sway/display focus main --move $out_main
bindsym $mod+Shift+r exec ~/.config/sway/display focus right --move $out_right
