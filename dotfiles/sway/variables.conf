# Variables shared by every host. Loaded before host.conf, so a host file can
# build its hooks out of these.

set $mod Mod4

# Dropdown terminal, see 50-scratchpad.conf. $term itself is a host hook,
# since not every machine has the same terminal installed.
set $title dropdown-scratch

# Poke i3status after changing volume so the bar updates immediately.
set $refresh_i3status killall -SIGUSR1 i3status

# Workspace names, kept in variables so the bindings in
# 63-bindings-workspace.conf don't repeat the literals.
set $ws1 "1"
set $ws2 "2"
set $ws3 "3"
set $ws4 "4"
set $ws5 "5"
set $ws6 "6"
set $ws7 "7"
set $ws8 "8"
set $ws9 "9"
set $ws10 "10"
